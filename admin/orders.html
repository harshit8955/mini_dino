<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders — PUSHPAK</title>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>🌿 PUSHPAK</h2>
  <a href="dashboard.html">📊 Dashboard</a>
  <a href="add-plant.html">➕ Add Plant</a>
  <a href="manage-plants.html">🪴 Manage Plants</a>
  <a href="orders.html" class="active">📦 Orders</a>
  <a href="users.html">👥 Users</a>
  <a href="create-admin.html">🔐 Create Admin</a>
  <a href="../index.html">🌐 View Website</a>
  <a href="../login.html" onclick="localStorage.removeItem('adminLoggedIn')">🚪 Logout</a>
  <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
</div>

<!-- CONTENT -->
<div class="content">

  <h2>📦 Orders</h2>

  <div id="ordersContainer">
    <table>
      <thead>
        <tr>
          <th>Order ID</th>
          <th>Customer</th>
          <th>Items</th>
          <th>Total</th>
          <th>Status</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="ordersList"></tbody>
    </table>
  </div>

</div>

<!-- SCRIPTS -->
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/session.js"></script>
<script src="../assets/js/admin.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function(){
  const orders = JSON.parse(localStorage.getItem("orders")) || [];
  const tbody = document.getElementById("ordersList");

  if(orders.length === 0){
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:30px;color:var(--admin-text-m);">No orders yet.</td></tr>';
    return;
  }

  orders.forEach((order, i) => {
    const status = order.status || "Placed";
    let badgeClass = "badge-placed";
    if(status === "Shipped") badgeClass = "badge-shipped";
    if(status === "Delivered") badgeClass = "badge-delivered";

    tbody.innerHTML += `
      <tr>
        <td>#${1001 + i}</td>
        <td>${order.customer || "Guest"}</td>
        <td>${order.items || 1}</td>
        <td>₹${order.total || 0}</td>
        <td><span class="badge ${badgeClass}">${status}</span></td>
        <td>${order.date || new Date().toLocaleDateString()}</td>
      </tr>
    `;
  });
});
</script>

</body>
</html>
