<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users — PUSHPAK</title>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>🌿 PUSHPAK</h2>
  <a href="dashboard.html">📊 Dashboard</a>
  <a href="add-plant.html">➕ Add Plant</a>
  <a href="manage-plants.html">🪴 Manage Plants</a>
  <a href="orders.html">📦 Orders</a>
  <a href="users.html" class="active">👥 Users</a>
  <a href="create-admin.html">🔐 Create Admin</a>
  <a href="../index.html">🌐 View Website</a>
  <a href="../login.html" onclick="localStorage.removeItem('adminLoggedIn')">🚪 Logout</a>
  <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
</div>

<!-- CONTENT -->
<div class="content">

  <h2>👥 Users</h2>

  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Name</th>
        <th>Email</th>
        <th>Joined</th>
      </tr>
    </thead>
    <tbody id="usersList"></tbody>
  </table>

</div>

<!-- SCRIPTS -->
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/session.js"></script>
<script src="../assets/js/admin.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function(){
  const users = JSON.parse(localStorage.getItem("users")) || [];
  const tbody = document.getElementById("usersList");

  if(users.length === 0){
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:30px;color:var(--admin-text-m);">No registered users yet.</td></tr>';
    return;
  }

  users.forEach((user, i) => {
    tbody.innerHTML += `
      <tr>
        <td>${i + 1}</td>
        <td>${user.name || "—"}</td>
        <td>${user.email || "—"}</td>
        <td>${user.date || "—"}</td>
      </tr>
    `;
  });
});
</script>

</body>
</html>
