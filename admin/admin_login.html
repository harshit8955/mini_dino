<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — PUSHPAK</title>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/admin_login.css">
</head>
<body>

<div class="login-container">
  <div class="login-card">

    <h2>🌿 Admin Login</h2>

    <form id="loginForm">
      <label>Username</label>
      <input type="text" id="username" required placeholder="Enter username">

      <label>Password</label>
      <input type="password" id="password" required placeholder="Enter password">

      <button type="submit">Login</button>

      <p id="errorMsg" class="error"></p>
    </form>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:15px;">
      <a href="../index.html" style="text-decoration:none;color:var(--admin-text-m,#666);font-size:14px;">
        ⬅ Back to Home
      </a>
      <button class="theme-toggle" onclick="toggleTheme()" style="margin-top:0;">🌙</button>
    </div>

  </div>
</div>

<!-- theme.js MUST load first so toggleTheme() exists -->
<script src="../assets/js/theme.js"></script>

<script>
/* ===== LOGIN ===== */
document.getElementById("loginForm").addEventListener("submit", function(e){
  e.preventDefault();

  const user = document.getElementById("username").value.trim();
  const pass = document.getElementById("password").value;
  const error = document.getElementById("errorMsg");

  // Default admin always works
  const DEFAULT = { username: "admin", password: "password", role: "admin", name: "Admin" };

  let stored = [];
  try { stored = JSON.parse(localStorage.getItem("admins")) || []; } catch(e){}

  const all = [DEFAULT, ...stored];

  const valid = all.find(a =>
    (a.username === user || a.email === user) && a.password === pass
  );

  if(valid){
    localStorage.setItem("currentUser", JSON.stringify(valid));
    localStorage.setItem("adminLoggedIn", "true");
    window.location.href = "dashboard.html";
  } else {
    error.textContent = "Invalid credentials. Default: admin / password";
  }
});
</script>

</body>
</html>
