<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Plant — PUSHPAK</title>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>🌿 PUSHPAK</h2>
  <a href="dashboard.html">📊 Dashboard</a>
  <a href="add-plant.html" class="active">➕ Add Plant</a>
  <a href="manage-plants.html">🪴 Manage Plants</a>
  <a href="orders.html">📦 Orders</a>
  <a href="users.html">👥 Users</a>
  <a href="create-admin.html">🔐 Create Admin</a>
  <a href="../index.html">🌐 View Website</a>
  <a href="../login.html" onclick="localStorage.removeItem('adminLoggedIn')">🚪 Logout</a>
  <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
</div>

<!-- CONTENT -->
<div class="content">

  <h2>➕ Add New Plant</h2>

  <form id="plantForm" class="plant-form">

    <label>Special Tag</label>
    <select id="ptag">
      <option value="">None</option>
      <option value="new">New</option>
      <option value="featured">Featured</option>
      <option value="sale">Sale</option>
      <option value="bestseller">Bestseller</option>
    </select>

    <label>Plant Name</label>
    <input type="text" id="plantName" required placeholder="Enter plant name">

    <label>Category</label>
    <select id="category" required>
      <option value="">Select Category</option>
      <option value="Indoor">Indoor</option>
      <option value="Outdoor">Outdoor</option>
      <option value="flowering">Flowering</option>
      <option value="succulent">Succulent</option>
      <option value="fruit">Fruit</option>
    </select>

    <label>Price (₹)</label>
    <input type="number" id="price" required placeholder="Enter price">

    <label>Upload Image</label>
    <input type="file" id="imageUpload" accept="image/*" required>

    <img id="preview" class="image-preview">

    <button type="submit">Add Plant</button>

  </form>

</div>

<!-- SCRIPTS -->
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/session.js"></script>
<script src="../assets/js/admin.js"></script>

</body>
</html>
