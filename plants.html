<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PUSHPAK — Plants &amp; Trees</title>
  <link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/style.css">
  </head>
<body>

<div class="navbar">
  <div class="navbar-left">
    <a href="javascript:history.back()" class="back-btn">⬅ Back</a>
    🌿 Pushpak
  </div>

  <div class="navbar-right">
    <a href="index.html">Home</a>
    <a href="plants.html">Plants</a>
    <a href="cart.html">Cart</a>
    <a href="favorites.html">❤️</a>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
  </div>
</div>

<div class="container">

  <div class="search-wrapper">
    <input id="search" placeholder="🔍 Search plants..." onkeyup="searchPlant()">
  </div>

  <div class="filter-row">
    <select id="filterCategory" class="filter">
      <option value="All">All Categories</option>
      <option value="indoor">Indoor</option>
      <option value="outdoor">Outdoor</option>
      <option value="flowering">Flowering</option>
      <option value="succulent">Succulents</option>
      <option value="fruit">Fruit</option>
    </select>
  </div>

  <div id="plantGrid" class="plant-grid"></div>

</div>

<script src="assets/js/theme.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/admin.js"></script>

<style>
/* ===== RESET ===== */
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

:root { --primary: #2e7d32; --primary-dark: #1b5e20; }

body { background: #f4f6f9; }

/* ===== NAVBAR ===== */
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--primary);
  padding: 15px 30px;
  color: white;
}

.navbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 18px;
  font-weight: 600;
}

.navbar-right {
  display: flex;
  align-items: center;
  gap: 20px;
}

.navbar-right a { color: white; text-decoration: none; }

.theme-toggle {
  background: var(--primary-dark);
  border: none;
  padding: 6px 10px;
  border-radius: 6px;
  color: white;
  cursor: pointer;
}

/* ===== BACK BTN ===== */
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 14px;
  border: 2px solid rgba(255,255,255,0.6);
  border-radius: 20px;
  font-weight: 600;
  font-size: 14px;
  color: white !important;
  text-decoration: none;
  background: rgba(255,255,255,0.12);
  transition: all 0.25s ease;
}
.back-btn:hover { background: rgba(255,255,255,0.28); transform: translateX(-3px); }

/* ===== CONTAINER ===== */
.container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }

/* ===== SEARCH + FILTER ===== */
.search-wrapper { margin-bottom: 15px; }

#search {
  width: 100%;
  max-width: 400px;
  padding: 10px 15px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 14px;
  outline: none;
}

.filter-row { margin-bottom: 20px; }

.filter {
  padding: 8px 12px;
  border-radius: 6px;
  border: 1px solid #ccc;
  background: white;
  font-size: 14px;
  cursor: pointer;
  min-width: 160px;
}

/* ===== GRID ===== */
.plant-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 20px;
}

/* ===== CARD ===== */
.plant-card {
  background: white;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 4px 10px rgba(0,0,0,0.08);
  transition: transform 0.3s;
}

.plant-card:hover { transform: translateY(-5px); }

.plant-card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}

.plant-card .info { padding: 15px; }

.plant-card h4 { margin-bottom: 4px; font-size: 16px; }

/* ===== DARK MODE ===== */
body.dark { background: #121212; color: white; }
body.dark .plant-card { background: #1e1e1e; }
body.dark .navbar { background: #1b5e20; }
body.dark #search, body.dark .filter { background: #2a2a2a; color: white; border-color: #444; }

/* ===== RESPONSIVE ===== */
@media (max-width: 600px) {
  .navbar { flex-direction: column; gap: 10px; }
  .plant-grid { grid-template-columns: 1fr; }
}
</style>

</body>
</html>
